[package]
name = "cli-launcher"
version = "0.1.1"
edition = "2024"
description = "Rust CLI project launcher"

[dependencies]
fs2 = "0.4"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "unstable-winit-030",
    "compat-1-2",
] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[build-dependencies]
slint-build = "1.17"
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
